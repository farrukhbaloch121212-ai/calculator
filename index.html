<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interest Rate Calculator</title>
    <meta name="description" content="Calculate your interest rates accurately.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Interest Rate Calculator</h1>
    <input type="number" id="principal" placeholder="Principal Amount">
    <input type="number" id="rate" placeholder="Interest Rate (%)">
    <input type="number" id="time" placeholder="Time (Years)">
    <button onclick="calculateInterest()">Calculate</button>
    <p id="result"></p>
</body>
</html>
